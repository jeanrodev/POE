name: MOE QA Analysis

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements.txt'
  pull_request:
    branches: [ main ]
    paths:
      - '**.py'

jobs:
  moe-qa:
    runs-on: ubuntu-latest
    
    services:
      ollama:
        image: ollama/ollama:latest
        options: --cpus 4 --memory 8g
        ports:
          - 11434:11434

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Wait for Ollama
        run: |
          for i in {1..30}; do
            curl -f http://localhost:11434/api/tags && break
            sleep 2
          done
      
      - name: Pull minimal model (for testing)
        run: ollama pull mistral:7b
      
      - name: Run style checks
        run: |
          black --check moe_qa/
          flake8 moe_qa/ --max-line-length=100
      
      - name: Run type checking
        run: mypy moe_qa/ --ignore-missing-imports
      
      - name: Run pytest
        run: pytest tests/ -v --cov=moe_qa
      
      - name: Run MOE analysis on source code
        run: |
          python moe_qa/main.py moe_qa/ \
            --format json \
            --output-dir ./qa_results \
            --context "CI/CD environment"
      
      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: qa-results
          path: qa_results/
      
      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const results = fs.readdirSync('./qa_results').filter(f => f.endsWith('.json'));
            
            if (results.length > 0) {
              const data = JSON.parse(fs.readFileSync(`./qa_results/${results[0]}`, 'utf8'));
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔍 MOE QA Analysis Results\n\nOverall Severity: **${data.overall_severity.toUpperCase()}**\n\n- Security: ${data.security.severity}\n- Quality: ${data.quality.severity}\n- Tests: ${data.tests.severity}\n- Docs: ${data.docs.severity}\n\n[Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
              });
            }
